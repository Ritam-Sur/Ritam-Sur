<svg width="100%" height="100%" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F" />
      <stop offset="50%" stop-color="#09152B" />
      <stop offset="100%" stop-color="#0B1730" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#4F7CFF" stop-opacity="0.75" />
      <stop offset="65%" stop-color="#6C63FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.25" />
    </linearGradient>

    <!-- Top Rim Light -->
    <linearGradient id="topRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F7CFF" stop-opacity="0" />
      <stop offset="30%" stop-color="#4F7CFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#DCE7FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#6C63FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Lighting Atmosphere -->
    <radialGradient id="centerAtmosphere" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#4F7CFF" stop-opacity="0.2" />
      <stop offset="45%" stop-color="#2563EB" stop-opacity="0.08" />
      <stop offset="80%" stop-color="#6C63FF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#07111F" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="topBeamGlow" cx="50%" cy="0%" r="45%">
      <stop offset="0%" stop-color="#4F7CFF" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#6C63FF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#07111F" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="leftAmbient" cx="12%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#07111F" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rightAmbient" cx="88%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#6C63FF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#07111F" stop-opacity="0" />
    </radialGradient>

    <!-- Typography Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#DCE7FF" />
    </linearGradient>

    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DCE7FF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#DCE7FF" />
    </linearGradient>

    <!-- Bottom Wave & Accent Gradients -->
    <linearGradient id="waveFill" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.04" />
      <stop offset="35%" stop-color="#4F7CFF" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#6C63FF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="waveLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.0" />
      <stop offset="20%" stop-color="#4F7CFF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6C63FF" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#4F7CFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0" />
      <stop offset="25%" stop-color="#4F7CFF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#DCE7FF" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#6C63FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0" />
    </linearGradient>

    <!-- Dot Pattern -->
    <pattern id="dotPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.1" fill="#4F7CFF" fill-opacity="0.22" />
    </pattern>

    <!-- Radial Mask for Grid Pattern -->
    <radialGradient id="gridMaskGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="320" fill="url(#gridMaskGrad)" />
    </mask>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#4F7CFF" flood-opacity="0.22" />
    </filter>

    <!-- Base Clip -->
    <clipPath id="cardClip">
      <rect width="1200" height="320" rx="16" ry="16" />
    </clipPath>
  </defs>

  <style>
    .name-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, 'Helvetica Neue', sans-serif;
      font-size: 62px;
      font-weight: 750;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Text', Roboto, 'Helvetica Neue', sans-serif;
      font-size: 19.5px;
      font-weight: 450;
      letter-spacing: 0.8px;
    }
    .dot-sep {
      fill: #4F7CFF;
      font-weight: 700;
    }

    /* Animations */
    @keyframes waveShift {
      0% { transform: translateX(0); }
      100% { transform: translateX(-1200px); }
    }
    @keyframes nodePulse1 {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes nodePulse2 {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(3px, -4px); }
    }
    @keyframes ambientPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes ambientPulseSlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .wave-layer {
      animation: waveShift 20s linear infinite;
    }
    .wave-layer-slow {
      animation: waveShift 28s linear infinite;
    }
    .pulse-1 { animation: nodePulse1 8s ease-in-out infinite; }
    .pulse-2 { animation: nodePulse2 12s ease-in-out infinite; }
    .pulse-3 { animation: nodePulse1 15s ease-in-out infinite; }
    
    .float-1 { animation: float1 10s ease-in-out infinite; }
    .float-2 { animation: float2 14s ease-in-out infinite; }
    .float-3 { animation: float3 17s ease-in-out infinite; }
    
    .ambient { animation: ambientPulse 12s ease-in-out infinite; }
    .ambient-slow { animation: ambientPulseSlow 18s ease-in-out infinite; }
    .ambient-delay { animation: ambientPulse 15s ease-in-out infinite 3s; }
  </style>

  <!-- Container with Rounded Corners Clip -->
  <g clip-path="url(#cardClip)">
    <!-- Base Deep Navy Background -->
    <rect width="1200" height="320" fill="url(#bgGrad)" />

    <!-- Ambient Lighting Atmosphere -->
    <rect width="1200" height="320" fill="url(#centerAtmosphere)" class="ambient" />
    <rect width="1200" height="320" fill="url(#topBeamGlow)" class="ambient-slow" />
    <rect width="1200" height="320" fill="url(#leftAmbient)" class="ambient-delay" />
    <rect width="1200" height="320" fill="url(#rightAmbient)" class="ambient" />

    <!-- Masked Grid Matrix -->
    <rect width="1200" height="320" fill="url(#dotPattern)" mask="url(#gridMask)" />

    <!-- Subtle Geometric Light Constellations (Left balance) -->
    <g opacity="0.32" stroke="#4F7CFF" stroke-width="1">
      <line x1="90" y1="80" x2="170" y2="120" stroke-dasharray="3 3" class="pulse-1" />
      <line x1="170" y1="120" x2="245" y2="90" class="pulse-2" />
      <line x1="245" y1="90" x2="295" y2="155" stroke-dasharray="2 4" class="pulse-3" />
      <line x1="170" y1="120" x2="195" y2="200" class="pulse-1" />
      <line x1="195" y1="200" x2="120" y2="235" stroke-dasharray="3 3" class="pulse-2" />
    </g>
    <!-- Left Nodes -->
    <circle cx="90" cy="80" r="2" fill="#4F7CFF" class="pulse-2" />
    <circle cx="170" cy="120" r="3" fill="#DCE7FF" filter="url(#nodeGlow)" class="pulse-1" />
    <circle cx="245" cy="90" r="2.5" fill="#6C63FF" filter="url(#nodeGlow)" class="pulse-3" />
    <circle cx="295" cy="155" r="2" fill="#4F7CFF" class="pulse-2" />
    <circle cx="195" cy="200" r="2.5" fill="#2563EB" class="pulse-1" />
    <circle cx="120" cy="235" r="2" fill="#6C63FF" class="pulse-3" />

    <!-- Subtle Geometric Light Constellations (Right balance) -->
    <g opacity="0.32" stroke="#6C63FF" stroke-width="1">
      <line x1="1110" y1="90" x2="1030" y2="120" stroke-dasharray="3 3" class="pulse-2" />
      <line x1="1030" y1="120" x2="955" y2="85" class="pulse-1" />
      <line x1="955" y1="85" x2="905" y2="150" stroke-dasharray="2 4" class="pulse-3" />
      <line x1="1030" y1="120" x2="1005" y2="200" class="pulse-2" />
      <line x1="1005" y1="200" x2="1080" y2="230" stroke-dasharray="3 3" class="pulse-1" />
    </g>
    <!-- Right Nodes -->
    <circle cx="1110" cy="90" r="2" fill="#4F7CFF" class="pulse-1" />
    <circle cx="1030" cy="120" r="3" fill="#DCE7FF" filter="url(#nodeGlow)" class="pulse-2" />
    <circle cx="955" cy="85" r="2.5" fill="#6C63FF" filter="url(#nodeGlow)" class="pulse-3" />
    <circle cx="905" cy="150" r="2" fill="#4F7CFF" class="pulse-1" />
    <circle cx="1005" cy="200" r="2.5" fill="#6C63FF" class="pulse-2" />
    <circle cx="1080" cy="230" r="2" fill="#2563EB" class="pulse-3" />

    <!-- Floating Ambient Particles -->
    <g class="float-1">
      <circle cx="150" cy="260" r="1.5" fill="#4F7CFF" class="pulse-1" />
      <circle cx="850" cy="80" r="1" fill="#DCE7FF" class="pulse-3" />
    </g>
    <g class="float-2">
      <circle cx="350" cy="100" r="2" fill="#6C63FF" class="pulse-2" filter="url(#nodeGlow)" />
      <circle cx="1050" cy="270" r="1.5" fill="#2563EB" class="pulse-1" />
    </g>
    <g class="float-3">
      <circle cx="750" cy="220" r="1.5" fill="#4F7CFF" class="pulse-2" />
      <circle cx="220" cy="60" r="2" fill="#6C63FF" class="pulse-3" filter="url(#nodeGlow)" />
    </g>

    <!-- Subtle Futuristic Corner Framing Accents -->
    <path d="M 28 42 L 28 28 L 42 28" fill="none" stroke="#4F7CFF" stroke-width="1.5" opacity="0.45" />
    <path d="M 1158 28 L 1172 28 L 1172 42" fill="none" stroke="#6C63FF" stroke-width="1.5" opacity="0.45" />
    <path d="M 28 278 L 28 292 L 42 292" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.45" />
    <path d="M 1172 278 L 1172 292 L 1158 292" fill="none" stroke="#4F7CFF" stroke-width="1.5" opacity="0.45" />

    <!-- Smooth Bottom Wave Transition -->
    <path class="wave-layer" d="M 0 280 C 400 240, 800 320, 1200 280 C 1600 240, 2000 320, 2400 280 L 2400 320 L 0 320 Z" fill="url(#waveFill)" />
    <path class="wave-layer" d="M 0 280 C 400 240, 800 320, 1200 280 C 1600 240, 2000 320, 2400 280" fill="none" stroke="url(#waveLine)" stroke-width="1.6" filter="url(#softGlow)" />
    <path class="wave-layer-slow" d="M 0 270 C 400 310, 800 230, 1200 270 C 1600 310, 2000 230, 2400 270" fill="none" stroke="url(#waveLine)" stroke-width="0.9" opacity="0.35" />

    <!-- Top Rim Light Highlight -->
    <line x1="360" y1="1" x2="840" y2="1" stroke="url(#topRimGrad)" stroke-width="2" />

    <!-- Primary Title: Ritam Sur (Dominant Visual Element) -->
    <g filter="url(#textDropShadow)">
      <text x="600" y="144" text-anchor="middle" class="name-title" fill="url(#nameGrad)">Ritam Sur</text>
    </g>

    <!-- Center Accent Horizon Line / Divider -->
    <g transform="translate(600, 174)">
      <line x1="-130" y1="0" x2="130" y2="0" stroke="url(#dividerGrad)" stroke-width="1.5" />
      <circle cx="0" cy="0" r="2.8" fill="#DCE7FF" filter="url(#nodeGlow)" />
      <circle cx="-65" cy="0" r="1.5" fill="#4F7CFF" />
      <circle cx="65" cy="0" r="1.5" fill="#6C63FF" />
    </g>

    <!-- Subtitle: Software Engineer • Agentic AI • LLMs & RAG -->
    <text x="600" y="214" text-anchor="middle" class="subtitle" fill="url(#subtitleGrad)">
      Software Engineer <tspan class="dot-sep">•</tspan> Agentic AI <tspan class="dot-sep">•</tspan> LLMs &amp; RAG
    </text>

    <!-- Crisp Outer Precision Border (1.5px) -->
    <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="15.25" ry="15.25" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
  </g>
</svg>
